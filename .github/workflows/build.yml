name: Deploy Lumina

# Publishes the install website to GitHub Pages.
# This workflow does not sign IPAs and does not install apps.
# Install happens on the site / profile in Safari.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site
        run: |
          set -euo pipefail
          mkdir -p _site/apps _site/manifests _site/assets
          cp index.html profile.mobileconfig _site/
          cp apps/catalog.json _site/catalog.json
          if [ -d assets ]; then cp -r assets/* _site/assets/ || true; fi
          if [ -d manifests ]; then cp -r manifests/. _site/manifests/; fi
          find apps -maxdepth 1 -type f -name '*.ipa' -exec cp {} _site/apps/ \; || true

          python3 << 'PY'
          from pathlib import Path
          import os
          repo = os.environ["GITHUB_REPOSITORY"]
          owner, name = repo.split("/")
          pages = f"https://{owner}.github.io/{name}"
          for rel in ("index.html", "profile.mobileconfig"):
              p = Path("_site") / rel
              p.write_text(p.read_text().replace("__PAGES_URL__", pages))
          man = Path("_site/manifests")
          if man.exists():
              for f in man.glob("*.plist"):
                  f.write_text(f.read_text(errors="ignore").replace("__PAGES_URL__", pages))
          print(pages)
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
